aid: openrelay
name: OpenRelay
description: >-
  OpenRelay is a Y Combinator-backed distributed GPU cloud for production AI
  inference — "the CDN of inference." It runs a global mesh of GPUs (RTX 4090/5090,
  A100, H100) that teams reach through a single API: rent dedicated GPU VMs with
  SSH and persistent volumes, stand up autoscaling inference clusters behind an
  endpoint, or call hosted open models via an OpenAI-compatible (and Anthropic
  Messages-compatible) API. Anyone can also join as a provider and earn on idle
  compute. The control-plane REST API (api.openrelay.inc) manages orgs, VMs,
  clusters, snapshots, billing, usage, transfers, provider nodes, batches, files,
  and webhooks, and is fully driveable from the first-party `orl` CLI — which also
  ships an official MCP server for agents. Traffic reroutes across healthy nodes
  in milliseconds, with pricing OpenRelay claims is up to 90% cheaper than the
  hyperscalers.
